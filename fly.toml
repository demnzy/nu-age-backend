app = 'nu-age'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[env]
  # This forces Python to look in the current directory for your modules
  PYTHONPATH = "." 

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  
[processes]
  app = "/app/.venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000"